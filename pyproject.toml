[project]
name = "cli-task-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dmzjb", email = "kubadomowicz2@wp.pl" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.1",
]

[project.scripts]
cli-task-manager = "cli_task_manager:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pyright]
typeCheckingMode = 'strict'
